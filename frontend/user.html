<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Форма користувача</title>
</head>
<body>

<h2>Форма користувача</h2>

<form id="userForm">
  <input type="text" id="name" placeholder="Ваше ім'я" required>
  <input type="email" id="email" placeholder="Email" required>
  <textarea id="message" placeholder="Повідомлення" required></textarea>
  <button type="submit">Надіслати</button>
</form>

<p id="status"></p>

<script>
  const form = document.getElementById("userForm");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const data = {
      name: document.getElementById("name").value,
      email: document.getElementById("email").value,
      message: document.getElementById("message").value
    };

    // LocalStorage
    localStorage.setItem("userName", data.name);
    localStorage.setItem("userEmail", data.email);

    // SessionStorage
    sessionStorage.setItem("lastMessage", data.message);

    const res = await fetch("https://movie-chatbot-backend.onrender.com/api/user", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(data)
    });

    const result = await res.json();
    document.getElementById("status").innerText = result.status;
  });
</script>

</body>
</html>
