<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Movie Chatbot — ЛР6</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="chatContainer">
    <h2>🎬 Movie Chatbot</h2>
    <div id="chat-window"></div>

    <input type="text" id="user-input" placeholder="Введіть повідомлення..." />
    <button id="send-btn">Надіслати</button>
  </div>

  <script>
    const chatWindow = document.getElementById("chat-window");
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");

    sendBtn.addEventListener("click", async () => {
      const message = userInput.value.trim();
      if (!message) return;

      const userMsg = document.createElement("p");
      userMsg.textContent = `👤 Ви: ${message}`;
      chatWindow.appendChild(userMsg);

      const response = await fetch("https://movie-chatbot-4-ic37.onrender.com/api/ai", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: message })
      });

      const data = await response.json();

      const botMsg = document.createElement("p");
      botMsg.textContent = `🤖 Бот: ${data.reply}`;
      chatWindow.appendChild(botMsg);

      userInput.value = "";
    });
  </script>
</body>
</html>
