<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Movie Chatbot — ЛР2</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div id="mainContainer">
    <form id="userForm">
        <input type="text" id="name" placeholder="Ваше ім'я" required>
        <input type="email" id="email" placeholder="Email" required>
        <textarea id="message" placeholder="Повідомлення" required></textarea>
        <button type="submit">Надіслати</button>
        <p id="status"></p>
    </form>

    <div id="chatContainer">
        <h2>🎬 Movie Chatbot</h2>
        <div id="chat-window"></div>
        <input type="text" id="user-input" placeholder="Введіть повідомлення...">
        <button id="send-btn">Надіслати</button>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
